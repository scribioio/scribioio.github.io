<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scribio</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 0.25rem; }
    .tagline { color: #888; margin-top: 0; }
    code {
      background: rgba(127,127,127,0.15);
      padding: 0.1em 0.4em;
      border-radius: 4px;
      font-size: 0.95em;
    }
    .footer { margin-top: 3rem; color: #888; font-size: 0.85em; }
  </style>
</head>
<body>
  <h1>Scribio</h1>
  <p class="tagline">Local-first meeting transcription &amp; speaker identification for macOS.</p>

  <p>
    This site hosts the
    <code>apple-app-site-association</code>
    file used for OAuth callbacks and Universal Links into the Scribio macOS app.
    There is nothing user-facing to see here yet.
  </p>

  <p class="footer">
    &copy; Scribio. Built local-first.
  </p>

</html>
