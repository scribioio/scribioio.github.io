<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Returning to Scribio…</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      line-height: 1.6;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(127,127,127,0.3);
      border-top-color: rgba(127,127,127,0.9);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { color: #888; font-size: 0.9em; margin-top: 2rem; }
    .closeable { margin-top: 2rem; opacity: 0.7; }
    code {
      background: rgba(127,127,127,0.15);
      padding: 0.1em 0.4em;
      border-radius: 4px;
    }
    button {
      font: inherit;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(127,127,127,0.4);
      background: transparent;
      cursor: pointer;
      color: inherit;
    }
    button:hover { background: rgba(127,127,127,0.1); }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <h2>Sign-in complete</h2>
  <p id="status">Returning you to Scribio…</p>
  <p class="hint">
    OAuth landing page for Notion. Scribio bounces this callback to its
    <code>scribio://oauth/notion</code> custom URL scheme so the desktop
    app receives the authorization code natively.
  </p>
  <div class="closeable" id="closeable" hidden>
    <p>You can close this tab.</p>
    <button onclick="window.close()">Close tab</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var oauthError = params.get('error');
      if (code) {
        var deeplink = 'scribio://oauth/notion?code=' + encodeURIComponent(code) +
                       '&state=' + encodeURIComponent(state || '');
        setTimeout(function () { window.location.href = deeplink; }, 100);
      } else if (oauthError) {
        var deeplink = 'scribio://oauth/notion?error=' + encodeURIComponent(oauthError) +
                       '&state=' + encodeURIComponent(state || '');
        setTimeout(function () { window.location.href = deeplink; }, 100);
        document.getElementById('status').textContent =
          'Notion reported an error during sign-in. Returning to Scribio…';
      } else {
        document.getElementById('status').textContent =
          'No authorization code received. You can close this tab.';
      }
      setTimeout(function () {
        document.getElementById('closeable').hidden = false;
        try { window.close(); } catch (e) { /* expected on most browsers */ }
      }, 1500);
    })();
  </script>
</body>
</html>
